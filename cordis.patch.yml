# dsh-voice-greeting bundle patch.
# Fill in your own WAV paths after installing. Empty values are silent.
- insert:
    - id: dsh-voice-greeting
      name: dsh-voice-greeting
      config:
        startupAudio: ""
        startupAudios: []
        shutdownAudio: ""
        shutdownAudios: []
        shutdownServiceUrl: ""
        outputDevice: ""
        volume: 100
        fadeInMs: 30
        fadeOutMs: 80
        startupBlocking: false
        warmTts: true
        watchdogEnabled: true
        ffmpegPath: ""
        ttsPython: ""
        ttsServer: ""
        ttsHealth: ""
